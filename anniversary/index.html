<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>💜 Us &amp; Opor 💜</title>
  <meta name="theme-color" content="#e6dcff" />

  <!-- Same rule as the pages below: the link card shows a title and nothing
       else, so neither gift is spoiled in a chat preview. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://natthawin0614.github.io/anniversary/" />
  <meta property="og:title" content="💜 Us &amp; Opor 💜" />
  <meta property="og:description" content="" />
  <meta name="twitter:card" content="summary" />
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
  <link rel="icon" type="image/png" href="./6-months/assets/decor/heart.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Mali:wght@500;600&display=swap" rel="stylesheet" />

  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      min-height:100vh; min-height:100dvh;
      display:grid; place-items:center;
      padding:24px 16px;
      font-family:'Mali', system-ui, sans-serif; color:#4b3a78;
      background:radial-gradient(120% 80% at 50% 0%, #fff4f6 0%, #eadfff 55%, #cfbffa 100%);
      -webkit-font-smoothing:antialiased;
      -webkit-tap-highlight-color:transparent;
    }
    main{ width:min(100%, 560px); display:grid; gap:18px; text-align:center; }
    h1{ font-family:'Fredoka', sans-serif; font-weight:700; font-size:clamp(28px, 8vw, 40px); color:#8f6fe0; }
    .cards{ display:grid; gap:14px; }
    .card{
      display:flex; align-items:center; gap:14px;
      padding:14px 18px; border-radius:22px;
      background:#fff; color:inherit; text-decoration:none; text-align:left;
      box-shadow:0 0 0 2px var(--line) inset, 0 6px 0 var(--line);
      transition:transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .15s;
    }
    .card--4{ --line:#ffc9d8; } .card--6{ --line:#d9ccff; } .card--v{ --line:#ffb3c1; }
    .card img{ width:64px; height:64px; object-fit:contain; flex:none; }
    .card__emoji{ width:64px; flex:none; text-align:center; font-size:44px; line-height:64px; }
    .card b{ display:block; font-family:'Fredoka', sans-serif; font-size:21px; }
    .card span{ font-size:14px; color:#8673b5; }
    .card i{ margin-left:auto; font-style:normal; font-size:22px; }
    @media (hover:hover){ .card:hover{ transform:translateY(-4px) rotate(-1deg) scale(1.02); } }
    .card:active{ transform:translateY(4px) scale(.97); box-shadow:0 0 0 2px var(--line) inset, 0 2px 0 var(--line); }
  </style>
</head>
<body>
  <main>
    <h1>Us &amp; Opor</h1>
    <div class="cards">
      <a class="card card--6" href="./6-months/">
        <img src="./6-months/assets/decor/heart.png" alt="" />
        <div><b>6 Months</b><span>01.10.2026</span></div>
        <i>💜</i>
      </a>
      <a class="card card--4" href="./4-months/">
        <img src="./4-months/media/favicon.png" alt="" />
        <div><b>4 Months</b><span>01.08.2026</span></div>
        <i>🎀</i>
      </a>
      <a class="card card--v" href="https://love-opor.netlify.app/">
        <div class="card__emoji" aria-hidden="true">💌</div>
        <div><b>Valentine's Day</b><span>14.02.2026</span></div>
        <i>🌹</i>
      </a>
    </div>
  </main>
</body>
</html>
